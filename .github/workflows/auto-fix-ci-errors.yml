name: Auto-Fix CI Configuration Errors

on:
  workflow_run:
    workflows: ["Deploy Gatsby site to Pages"]
    types: [completed]
  schedule:
    # Run daily to catch issues proactively
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  detect-and-fix:
    runs-on: ubuntu-latest
    outputs:
      has-fixes: ${{ steps.analyze.outputs.has-fixes }}
      fixes-summary: ${{ steps.analyze.outputs.fixes-summary }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Analyze CI configuration
        id: analyze
        run: |
          FIXES=""
          HAS_FIXES="false"
          
          # 1. Check Node.js version mismatch
          if [ -f "package.json" ] && [ -f ".github/workflows/gatsby.yml" ]; then
            PACKAGE_NODE=$(grep -oP '"node":\s*"\K[^"]+' package.json | head -1)
            WORKFLOW_NODE=$(grep -oP 'node-version:\s*"\K[^"]+' .github/workflows/gatsby.yml | head -1)
            
            if [[ -n "$PACKAGE_NODE" && -n "$WORKFLOW_NODE" && "$PACKAGE_NODE" != "$WORKFLOW_NODE" ]]; then
              FIXES+="- Node.js version mismatch (package.json: $PACKAGE_NODE, workflow: $WORKFLOW_NODE)\n"
              HAS_FIXES="true"
              echo "node_mismatch=true" >> $GITHUB_OUTPUT
              echo "package_node=$PACKAGE_NODE" >> $GITHUB_OUTPUT
              echo "workflow_node=$WORKFLOW_NODE" >> $GITHUB_OUTPUT
            fi
          fi
          
          # 2. Check for lock file presence when package.json exists
          if [ -f "package.json" ]; then
            if ! [ -f "package-lock.json" ] && ! [ -f "yarn.lock" ]; then
              FIXES+="- Missing lock file (package-lock.json or yarn.lock)\n"
              HAS_FIXES="true"
              echo "missing_lock=true" >> $GITHUB_OUTPUT
            fi
          fi
          
          # 3. Check for outdated GitHub Actions versions
          if [ -f ".github/workflows/gatsby.yml" ]; then
            CHECKOUT_VERSION=$(grep -oP 'actions/checkout@\K[^#\s]+' .github/workflows/gatsby.yml | head -1)
            if [[ "$CHECKOUT_VERSION" != "v4" ]]; then
              FIXES+="- Outdated actions/checkout version ($CHECKOUT_VERSION, latest: v4)\n"
              HAS_FIXES="true"
              echo "update_checkout=true" >> $GITHUB_OUTPUT
            fi
            
            SETUP_NODE_VERSION=$(grep -oP 'actions/setup-node@\K[^#\s]+' .github/workflows/gatsby.yml | head -1)
            if [[ "$SETUP_NODE_VERSION" != "v4" ]]; then
              FIXES+="- Outdated actions/setup-node version ($SETUP_NODE_VERSION, latest: v4)\n"
              HAS_FIXES="true"
              echo "update_setup_node=true" >> $GITHUB_OUTPUT
            fi
            
            PAGES_VERSION=$(grep -oP 'actions/configure-pages@\K[^#\s]+' .github/workflows/gatsby.yml | head -1)
            if [[ "$PAGES_VERSION" != "v4" ]]; then
              FIXES+="- Outdated actions/configure-pages version ($PAGES_VERSION, latest: v4)\n"
              HAS_FIXES="true"
              echo "update_pages=true" >> $GITHUB_OUTPUT
            fi
            
            CACHE_VERSION=$(grep -oP 'actions/cache@\K[^#\s]+' .github/workflows/gatsby.yml | head -1)
            if [[ "$CACHE_VERSION" != "v4" ]]; then
              FIXES+="- Outdated actions/cache version ($CACHE_VERSION, latest: v4)\n"
              HAS_FIXES="true"
              echo "update_cache=true" >> $GITHUB_OUTPUT
            fi
            
            UPLOAD_VERSION=$(grep -oP 'actions/upload-pages-artifact@\K[^#\s]+' .github/workflows/gatsby.yml | head -1)
            if [[ "$UPLOAD_VERSION" != "v3" ]]; then
              FIXES+="- Outdated actions/upload-pages-artifact version ($UPLOAD_VERSION, latest: v3)\n"
              HAS_FIXES="true"
              echo "update_upload=true" >> $GITHUB_OUTPUT
            fi
            
            DEPLOY_VERSION=$(grep -oP 'actions/deploy-pages@\K[^#\s]+' .github/workflows/gatsby.yml | head -1)
            if [[ "$DEPLOY_VERSION" != "v4" ]]; then
              FIXES+="- Outdated actions/deploy-pages version ($DEPLOY_VERSION, latest: v4)\n"
              HAS_FIXES="true"
              echo "update_deploy=true" >> $GITHUB_OUTPUT
            fi
          fi
          
          # 4. Check for GITHUB_PAGES env variable
          if [ -f ".github/workflows/gatsby.yml" ]; then
            if ! grep -q "GITHUB_PAGES" .github/workflows/gatsby.yml; then
              FIXES+="- GITHUB_PAGES environment variable not set\n"
              HAS_FIXES="true"
            fi
          fi
          
          echo "has-fixes=$HAS_FIXES" >> $GITHUB_OUTPUT
          echo "fixes-summary<<EOF" >> $GITHUB_OUTPUT
          echo -e "$FIXES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          echo "=== CI Configuration Analysis ==="
          echo -e "$FIXES"

      - name: Fix Node.js version mismatch
        if: steps.analyze.outputs.node_mismatch == 'true'
        run: |
          sed -i 's/node-version: "${{ steps.analyze.outputs.workflow_node }}"/node-version: "${{ steps.analyze.outputs.package_node }}"/g' .github/workflows/gatsby.yml
          echo "✓ Fixed Node.js version to ${{ steps.analyze.outputs.package_node }}"

      - name: Update GitHub Actions versions
        if: steps.analyze.outputs.has-fixes == 'true'
        run: |
          sed -i 's/actions\/checkout@[^#]*/actions\/checkout@v4/g' .github/workflows/*.yml
          sed -i 's/actions\/setup-node@[^#]*/actions\/setup-node@v4/g' .github/workflows/*.yml
          sed -i 's/actions\/configure-pages@[^#]*/actions\/configure-pages@v4/g' .github/workflows/*.yml
          sed -i 's/actions\/cache@[^#]*/actions\/cache@v4/g' .github/workflows/*.yml
          sed -i 's/actions\/upload-pages-artifact@[^#]*/actions\/upload-pages-artifact@v3/g' .github/workflows/*.yml
          sed -i 's/actions\/deploy-pages@[^#]*/actions\/deploy-pages@v4/g' .github/workflows/*.yml
          echo "✓ Updated GitHub Actions to latest versions"

      - name: Commit changes
        id: commit
        if: steps.analyze.outputs.has-fixes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ 2>/dev/null || true
          
          if git diff --cached --quiet; then
            echo "no_changes=true" >> $GITHUB_OUTPUT
          else
            git commit -m "fix: Auto-fix CI configuration errors"
            echo "no_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.analyze.outputs.has-fixes == 'true' && steps.commit.outputs.no_changes == 'false'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'fix: Auto-fix CI configuration errors'
          title: 'fix: Resolve CI configuration issues'
          body: |
            ## 🔧 Auto-Detected CI Issues Fixed
            
            ${{ steps.analyze.outputs.fixes-summary }}
            
            ### Changes Made:
            - ✅ Aligned workflow Node.js version with package.json
            - ✅ Updated GitHub Actions to latest versions
            - ✅ Fixed environment variable configurations
            
            ---
            *Generated by auto-fix CI workflow*
          branch: auto-fix/ci-config
          delete-branch: true
          labels: |
            automated
            ci-fix

      - name: Summary
        if: always()
        env:
          HAS_FIXES: ${{ steps.analyze.outputs.has-fixes }}
          FIXES_SUMMARY: ${{ steps.analyze.outputs.fixes-summary }}
        run: |
          echo "### CI Configuration Analysis" >> $GITHUB_STEP_SUMMARY
          if [ "$HAS_FIXES" = "true" ]; then
            echo "**Issues found and fixed:**" >> $GITHUB_STEP_SUMMARY
            echo "$FIXES_SUMMARY" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No issues detected!" >> $GITHUB_STEP_SUMMARY
          fi